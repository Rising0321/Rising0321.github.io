name: Update Bilibili talk stats

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch play counts and update talks.json
        run: |
          python3 << 'PY'
          import json
          import urllib.request

          with open("data/talks.json", encoding="utf-8") as f:
              talks = json.load(f)

          for talk in talks:
              bvid = talk["bvid"]
              req = urllib.request.Request(
                  f"https://api.bilibili.com/x/web-interface/view?bvid={bvid}",
                  headers={"User-Agent": "Mozilla/5.0"},
              )
              with urllib.request.urlopen(req, timeout=20) as resp:
                  data = json.loads(resp.read().decode())
              if data.get("code") == 0:
                  talk["views"] = data["data"]["stat"]["view"]
                  talk["title"] = data["data"]["title"]

          with open("data/talks.json", "w", encoding="utf-8") as f:
              json.dump(talks, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/talks.json
          git diff --staged --quiet || git commit -m "Update Bilibili talk play counts."
          git push
