name: Update Bilibili talk stats

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bilibili-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Refresh video and collection statistics
        id: fetch
        run: python3 scripts/update_talks.py

      - name: Commit if changed
        if: ${{ !cancelled() && steps.fetch.outcome != 'skipped' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/talks.json index.html
          git diff --staged --quiet || git commit -m "Update Bilibili talk play counts."
          git pull --rebase origin "${{ github.ref_name }}"
          git push
